<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Simnetiq</title>
  <!--[if !mso]><!-->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <!--<![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f9;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <!-- Header -->
          <tr>
            <td align="center" style="padding:32px 40px 24px;border-bottom:1px solid #eef1f6;">
              <h1 style="margin:0;font-family:'DM Sans',sans-serif;font-size:28px;font-weight:700;color:#4975D4;letter-spacing:-0.5px;">Simnetiq</h1>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:32px 40px;font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.7;color:#172C2E;">
              {{CONTENT}}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px 32px;border-top:1px solid #eef1f6;text-align:center;font-family:'DM Sans',sans-serif;font-size:12px;color:#8b95a5;line-height:1.6;">
              <p style="margin:0 0 8px;">&copy; 2026 Simnetiq. All rights reserved.</p>
              <p style="margin:0;">
                <a href="{{UNSUBSCRIBE_URL}}" style="color:#8b95a5;text-decoration:underline;">Unsubscribe</a>
                &nbsp;&middot;&nbsp;
                <a href="https://simnetiq.store/privacy" style="color:#8b95a5;text-decoration:underline;">Privacy Policy</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
